{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
            EMG Manage
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet"
        href="{% static 'css/style.css' %}">
</head>

<body>

    {% include 'includes/navbar.html' %}

    <div class="container-fluid">

        <div class="row">

            {% include 'includes/sidebar.html' %}

            <main class="col-md-10 ms-sm-auto px-4 py-4">
                {% if messages %}

                    {% for message in messages %}

                        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show mb-3">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                            </button>

                        </div>

                    {% endfor %}

                {% endif %}

                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>

  <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>

{% block scripts %}
{% endblock %}

</body>
</html>
